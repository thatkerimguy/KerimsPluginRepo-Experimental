# Publishes the Valenced plugins under valenced/ as a Valenced plugin repository on
# GitHub Pages (the gh-pages branch): pool/<id>@<version>.zip plus index.json.
#
# Add https://thatkerimguy.github.io/KerimsPluginRepo/index.json as a repository in Valenced.
#
# A version is published once. To release a change, bump "version" in the plugin's
# manifest.json. Published ZIPs are never rebuilt, so their SHA-256 in index.json stays valid.
#
# Plugins here are JS-only, so this builds with the template's CLI directly instead of
# Gradle (which needs a read:packages token for the native Valenced API).
#
# Experimental mode: the same file runs in thatkerimguy/KerimsPluginRepo-Experimental
# (any repository whose name ends in "-Experimental"), a copy of this one for testing.
# There every push publishes a new build without bumping the manifest: version
# <manifest version>.<run number>, plugin id <id>-experimental and name "<name>
# Experimental", so it installs next to the stable plugin with its own storage
# (enable only one of them). Only the newest 5 experimental builds are kept.

name: Publish Valenced repository

on:
  push:
    branches: [main]
    paths:
      - "valenced/**"
      - ".github/workflows/valenced-repo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: valenced-repo
  cancel-in-progress: false

env:
  # Valenced/valenced-plugin-template commit the build was tested with
  TEMPLATE_REF: 9a4f9187137a75d86fe552d0e594889a6e6fd7e5
  BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  POOL_BRANCH: gh-pages
  EXPERIMENTAL: ${{ endsWith(github.event.repository.name, '-Experimental') }}
  KEEP_EXPERIMENTAL_BUILDS: 5

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          path: src

      - name: Check the shared files match the Vencord build
        run: |
          for f in cache.ts klipy.ts lowres.ts precache.ts queue.ts saved.ts transfer.ts; do
            diff -u "src/vencord/gifPickerOptimizer/$f" "src/valenced/gif-picker-optimizer/js/$f"
          done

      - name: Check out published branch
        run: |
          set -euo pipefail
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$url" "$POOL_BRANCH" >/dev/null; then
            git clone --depth 1 --branch "$POOL_BRANCH" "$url" published
          else
            git init -b "$POOL_BRANCH" published
            git -C published remote add origin "$url"
          fi
          mkdir -p published/pool
          touch published/.nojekyll

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Set up the Valenced plugin template
        run: |
          set -euo pipefail
          git init template
          git -C template fetch --depth 1 https://github.com/Valenced/valenced-plugin-template.git "$TEMPLATE_REF"
          git -C template checkout FETCH_HEAD
          rm -rf template/plugins/* template/themes/*
          cd template && bun install

      - name: Build and package new versions
        run: |
          set -euo pipefail
          for manifest in src/valenced/*/manifest.json; do
            dir="$(dirname "$manifest")"
            name="$(basename "$dir")"
            id="$(jq -r .id "$manifest")"
            version="$(jq -r .version "$manifest")"
            if [ "$EXPERIMENTAL" = "true" ]; then
              stable_id="$id"
              id="${id}-experimental"
              version="${version}.${GITHUB_RUN_NUMBER}"
            fi
            zip="published/pool/${id}@${version}.zip"
            if [ -f "$zip" ]; then
              echo "$id@$version is already published, skipping"
              continue
            fi
            echo "Building $id@$version"
            cp -r "$dir" "template/plugins/$name"
            built_manifest="template/plugins/$name/manifest.json"
            if [ "$EXPERIMENTAL" = "true" ]; then
              jq --arg id "$id" --arg version "$version" \
                '.id = $id | .version = $version | .name = "\(.name) Experimental" | .description = "Test build, may be broken. \(.description)"' \
                "$manifest" > "$built_manifest"
              # The plugin's storage paths use PLUGIN_ID: point them at the experimental id
              grep -rl --include='*.ts' --include='*.tsx' "\"$stable_id\"" "template/plugins/$name/js" \
                | xargs -r sed -i "s/\"$stable_id\"/\"$id\"/g"
              if grep -rq --include='*.ts' --include='*.tsx' "\"$stable_id\"" "template/plugins/$name/js"; then
                echo "::error::$stable_id is still in the source after renaming it"
                exit 1
              fi
            fi
            (cd template && bun run build "$name")
            python3 - "$built_manifest" "template/plugins/$name/build/js/index.js" "$zip" <<'PY'
          import json, sys, zipfile
          manifest, script, out = sys.argv[1:]
          m = json.load(open(manifest))
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              z.write(manifest, "manifest.json")
              z.write(script, m["dist"]["script"])
          PY
            if [ "$EXPERIMENTAL" = "true" ]; then
              # Keep only the newest experimental builds
              ls published/pool/"${id}"@*.zip | sort -V | head -n "-$KEEP_EXPERIMENTAL_BUILDS" | xargs -r rm -f
            fi
          done

      - name: Regenerate index.json
        run: |
          set -euo pipefail
          if [ "$EXPERIMENTAL" = "true" ]; then
            jq '.name = "\(.name) Experimental" | .description = "Test builds, may be broken. Use KerimsPluginRepo for the stable plugins. \(.description)"' \
              src/valenced/repo.config.json > template/repo.config.json
          else
            cp src/valenced/repo.config.json template/repo.config.json
          fi
          cd template
          bun run generate-index \
            --dist ../published/pool \
            --base-url "$BASE_URL/pool" \
            --out ../published/index.json

      - name: Copy the landing page
        run: |
          set -euo pipefail
          cp src/valenced/site/index.html published/index.html
          if [ "$EXPERIMENTAL" = "true" ]; then
            # Links and the repository URL point at this repository; say it's for testing
            sed -i \
              -E -e "s#KerimsPluginRepo(-Experimental)?#${{ github.event.repository.name }}#g" \
              -e 's#<p class="muted" id="tagline">#<p class="muted" id="tagline"><strong>Test builds, may be broken.</strong> #' \
              published/index.html
          fi

      - name: Push to ${{ env.POOL_BRANCH }}
        run: |
          set -euo pipefail
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "Publish Valenced repository (${GITHUB_SHA::7})"
          git push origin "HEAD:$POOL_BRANCH"
